name: 'AI Agent Modes test fixtures'
description: >
  Seeds a deterministic, provider-free fixture for the AI Agent Modes functional
  suite: a parent "Test Orchestrator" agent exposing two sub-agents (Test Child
  One / Test Child Two), an AI Assistant backed by that orchestrator, and one
  saved mode. This lets the browser suite exercise mode CRUD, the selector
  dropdown and the two chat-integration surfaces without depending on any
  distribution's own agent config or on a live LLM provider. Apply with
  `drush recipe`.
type: 'Testing'
install:
  - ai
  - ai_agents
  - ai_assistant_api
  - ai_chatbot
  - ai_agent_modes
# The parent agent, its two sub-agents, the AI Assistant and two saved modes (one
# that steers only, one that also withholds) are created from this recipe's own
# config/ directory when the recipe is applied.
#
# No block is placed. An earlier version of this fixture placed the "AI Agent Mode
# selector" block in the Gin admin content region, which put a Mode dropdown on
# every admin page of any site the fixture was applied to. The suite now asserts
# through the JSON options endpoint every client-rendered chat reads, which is
# both closer to what the surfaces actually do and harmless to the host site.
#
# canvas_ai is intentionally NOT installed here: it pulls the heavy drupal/canvas
# project, and the Canvas AI panel integration is proven through its client-side
# data source (the /ai-agent-modes/options/<agent> endpoint, which needs only
# ai_agents), not through the Canvas editor's React shadow DOM.
