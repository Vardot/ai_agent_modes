site_name: AI Agent Modes
site_url: https://project.pages.drupalcode.org/ai_agent_modes/
site_description: >
  Put a Mode dropdown in front of an AI agent chat, so the person using the
  assistant can say what kind of job they want done before they start typing.
repo_url: https://git.drupalcode.org/project/ai_agent_modes
repo_name: drupal/ai_agent_modes
edit_uri: /-/edit/1.0.x/docs/

nav:
  - Home: index.md
  - Using the assistant:
      - Choosing a mode: info/choosing-a-mode.md
  - Administering:
      - Managing modes: info/managing-modes.md
      - Speaking and listening: info/speech.md
  - Developing:
      - Developing with modes: info/developing-with-modes.md
  - Help:
      - Troubleshooting: help/troubleshooting.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.action.edit

markdown_extensions:
  # The walkthrough videos are embedded as HTML5 players, so raw HTML in the
  # markdown has to survive the build.
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
