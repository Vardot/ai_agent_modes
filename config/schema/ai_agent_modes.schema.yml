ai_agent_modes.ai_agent_mode.*:
  type: config_entity
  label: 'AI Agent Mode'
  mapping:
    id:
      type: machine_name
      label: 'ID'
    uuid:
      type: uuid
      label: 'UUID'
    label:
      type: required_label
      label: 'Label'
    description:
      type: text
      label: 'Description'
    weight:
      type: weight
      label: 'Weight'
    status:
      type: boolean
      label: 'Status'
    agent:
      type: string
      label: 'Parent agent'
      description: 'The parent AI agent this mode applies to. Empty means the mode is generic and applies to any agent.'
    sub_agents:
      type: sequence
      label: 'Sub-agents'
      description: 'The set of AiAgent plugin IDs this mode exposes to the orchestrator.'
      sequence:
        type: string
        label: 'Sub-agent plugin ID'
    system_prompt_addition:
      type: text
      label: 'System prompt addition'
      description: 'A short scoped directive prepended to the system prompt for this mode.'
    scope_strength:
      type: string
      label: 'Scope strength'
      description: 'guide steers with the prompt only. restrict also withholds the sub-agent tools this mode does not name. Honoured only for a mode with a parent agent and at least one sub-agent, and only on the ai_agents pipeline.'
      constraints:
        Choice:
          - guide
          - restrict
    assistants:
      type: sequence
      label: 'AI Assistants'
      description: 'The AI Assistants this mode is offered for. Empty means every assistant, and a mode that names assistants is not offered where there is no assistant.'
      sequence:
        type: string
        label: 'AI Assistant ID'
    surfaces:
      type: sequence
      label: 'Surfaces'
      description: 'The chat surfaces this mode applies to. Empty means all surfaces.'
      sequence:
        type: string
        label: 'Surface ID'

ai_agent_modes.settings:
  type: config_object
  label: 'AI Agent Modes settings'
  mapping:
    tool_scope_enforcement:
      type: boolean
      label: 'Enforce tool scope'
      description: 'When off, every mode set to restrict behaves as steer-only. An emergency switch that needs no mode edits.'
    chatbot_position:
      type: string
      label: 'AI Chatbot dropdown position'
      description: 'Where the mode dropdown sits in the AI Chatbot panel. Not asked on the settings form, which covers the Drupal Canvas AI panel: this is the site default an AI Assistant falls back to when it sets no placement of its own. above_chat puts it under the panel header and above the conversation, below_input under the message box, header inside the panel header row.'
      constraints:
        Choice:
          - above_chat
          - below_input
          - header
    show_dropdown:
      type: boolean
      label: 'Offer the mode dropdown in the chat'
      description: 'When off, no mode dropdown is added to either chat panel. The modes themselves are untouched, and anything already scoped by configuration still applies.'
    speech_to_text:
      type: mapping
      label: 'Speech to text'
      description: "deep-chat's microphone, transcribed by the browser's own Web Speech support. Mirrors https://deepchat.dev/docs/speech#speechToText. Azure is not offered here because it needs a key or token, which does not belong in configuration."
      mapping:
        enabled:
          type: boolean
          label: 'Offer a microphone in the chat'
        position:
          type: string
          label: 'Microphone position'
          description: 'start and end follow the writing direction. input_end and input_start sit inside the message box, outside_end and outside_start in deep-chat own row beside it.'
          constraints:
            Choice:
              - input_end
              - input_start
              - outside_end
              - outside_start
        language:
          type: string
          label: 'Dictation language'
          description: 'browser leaves the choice to the browser, site follows the page language, anything else is a BCP 47 tag such as en-US or en-GB.'
        display_interim_results:
          type: boolean
          label: 'Show words as they are recognised'
        stop_after_submit:
          type: boolean
          label: 'Stop recording once the message is sent'
        submit_after_silence:
          type: boolean
          label: 'Send after a pause in speaking'
        submit_after_silence_ms:
          type: integer
          label: 'Length of that pause, in milliseconds'
        interim_color:
          type: string
          label: 'Colour of words still being recognised'
        final_color:
          type: string
          label: 'Colour of recognised words'
        commands:
          type: mapping
          label: 'Voice commands'
          description: 'Spoken phrases that drive the chat instead of being typed into it. An empty phrase is not listened for.'
          mapping:
            stop:
              type: string
              label: 'Stop listening'
            pause:
              type: string
              label: 'Pause transcribing'
            resume:
              type: string
              label: 'Resume transcribing'
            remove_all_text:
              type: string
              label: 'Clear the message box'
            submit:
              type: string
              label: 'Send the message'
            command_mode:
              type: string
              label: 'Listen for commands only'
            substrings:
              type: boolean
              label: 'Recognise a phrase inside a longer sentence'
            case_sensitive:
              type: boolean
              label: 'Match the case of a phrase'
        translations:
          type: string
          label: 'Corrections'
          description: 'Words the recogniser hears wrongly, one "spoken|written" pair per line.'
    text_to_speech:
      type: mapping
      label: 'Text to speech'
      description: "Reads each reply aloud with the browser's own speech synthesis. Mirrors https://deepchat.dev/docs/speech#textToSpeech."
      mapping:
        enabled:
          type: boolean
          label: 'Read replies aloud'
        language:
          type: string
          label: 'Reading language'
          description: 'browser, site, or a BCP 47 tag.'
        voice_name:
          type: string
          label: 'Voice'
          description: 'The voice names differ by operating system, so a name that is not installed falls back to the default voice.'
        pitch:
          type: float
          label: 'Pitch'
        rate:
          type: float
          label: 'Speed'
        volume:
          type: float
          label: 'Volume'
    canvas_position:
      type: string
      label: 'Canvas AI dropdown position'
      constraints:
        Choice:
          - top
          - above_input
          - below_input
          - toolbar

block.settings.ai_agent_mode_selector:
  type: block_settings
  label: 'AI Agent Mode selector block'
  mapping:
    ai_assistant:
      type: string
      label: 'AI Assistant'
      description: 'The AI Assistant entity whose parent agent this selector applies to.'
    parent_agent:
      type: string
      label: 'Parent agent'
      description: 'The parent AI agent plugin ID this selector applies to, used when no AI Assistant is set.'
    surface:
      type: string
      label: 'Surface'
      description: 'Optional surface ID used to filter which modes are shown.'

# One AI Assistant may override where its mode dropdown sits, which is stored on
# the assistant's own entity so it travels with that assistant's configuration.
ai_assistant_api.ai_assistant.*.third_party.ai_agent_modes:
  type: mapping
  label: 'AI Agent Modes settings for this assistant'
  mapping:
    chatbot_position:
      type: string
      label: 'Mode dropdown position'
      description: 'Overrides ai_agent_modes.settings:chatbot_position for this assistant. Absent means the site setting applies.'
      constraints:
        Choice:
          - above_chat
          - below_input
          - header
    speech_to_text:
      type: string
      label: 'Offer a microphone in the chat'
      description: 'Overrides ai_agent_modes.settings:speech_to_text.enabled for this assistant. Absent means the site setting applies.'
      constraints:
        Choice:
          - 'on'
          - 'off'
    speech_to_text_position:
      type: string
      label: 'Microphone position'
      description: 'Overrides ai_agent_modes.settings:speech_to_text.position for this assistant. Absent means the site setting applies.'
      constraints:
        Choice:
          - input_end
          - input_start
          - outside_end
          - outside_start
    text_to_speech:
      type: string
      label: 'Read replies aloud'
      description: 'Overrides ai_agent_modes.settings:text_to_speech.enabled for this assistant. Absent means the site setting applies.'
      constraints:
        Choice:
          - 'on'
          - 'off'
