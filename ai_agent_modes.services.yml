services:
  ai_agent_modes.manager:
    class: Drupal\ai_agent_modes\ModeManager
    arguments:
      - '@entity_type.manager'
      - '@plugin.manager.ai_agents'
      - '@plugin.manager.ai.function_calls'
      - '@config.factory'
      - '@logger.channel.ai_agent_modes'
  Drupal\ai_agent_modes\ModeManagerInterface: '@ai_agent_modes.manager'

  # Request-scoped: which AI Assistant an agent run belongs to. Written by the
  # assistant subscriber, read by the agent subscriber.
  ai_agent_modes.assistant_context:
    class: Drupal\ai_agent_modes\ActiveAssistantContext

  ai_agent_modes.selection_store:
    class: Drupal\ai_agent_modes\SelectionStore
    arguments:
      - '@tempstore.private'
      - '@current_user'
  Drupal\ai_agent_modes\SelectionStoreInterface: '@ai_agent_modes.selection_store'

  ai_agent_modes.agent_scope_subscriber:
    class: Drupal\ai_agent_modes\EventSubscriber\AgentScopeSubscriber
    arguments:
      - '@ai_agent_modes.manager'
      - '@ai_agent_modes.selection_store'
      - '@ai_agent_modes.assistant_context'
      - '@logger.channel.ai_agent_modes'
    tags:
      - { name: event_subscriber }

  # Soft integration with the AI Assistant API: '@?' leaves the runner NULL when
  # that module is absent, and the subscriber subscribes by literal event name so
  # the container still compiles without it.
  ai_agent_modes.assistant_scope_subscriber:
    class: Drupal\ai_agent_modes\EventSubscriber\AssistantScopeSubscriber
    arguments:
      - '@?ai_assistant_api.runner'
      - '@ai_agent_modes.manager'
      - '@ai_agent_modes.selection_store'
      - '@ai_agent_modes.assistant_context'
      - '@logger.channel.ai_agent_modes'
    tags:
      - { name: event_subscriber }

  logger.channel.ai_agent_modes:
    parent: logger.channel_base
    arguments:
      - 'ai_agent_modes'

  # Hook class keyed by its FQCN so the class resolver finds this definition
  # (with a soft, possibly-absent ai_assistant_api.runner) instead of trying to
  # autowire the constructor.
  Drupal\ai_agent_modes\Hook\ChatFormHooks:
    class: Drupal\ai_agent_modes\Hook\ChatFormHooks
    arguments:
      - '@?ai_assistant_api.runner'
      - '@ai_agent_modes.manager'
      - '@ai_agent_modes.selection_store'
