name: 'AI Agent Modes'
type: module
description: 'Adds a "Mode" selector that steers an AI agent toward a curated subset of its sub-agents by prepending a scoped instruction, so the orchestrator routes work to the right sub-agent.'
package: 'AI'
core_version_requirement: ^11
dependencies:
  - 'ai:ai'
  # The mode scope subscribes to BuildSystemPromptEvent and
  # AgentStartedExecutionEvent, and calls the config-entity wrapper's function
  # override API. Referencing an event class that does not exist would fatal
  # while the container compiles, so the floor is a hard requirement.
  - 'ai_agents:ai_agents (>=1.3)'
optional_dependencies:
  - 'ai:ai_assistant_api'
  - 'ai:ai_chatbot'
  - 'canvas:canvas_ai'
configure: entity.ai_agent_mode.collection
