name: 'AI Agent Modes'
type: module
description: 'Adds a "Mode" selector that steers an AI agent toward a curated subset of its sub-agents by prepending a scoped instruction, so the orchestrator routes work to the right sub-agent.'
package: 'AI'
core_version_requirement: ^11
dependencies:
  - 'ai:ai'
  - 'ai_agents:ai_agents'
configure: entity.ai_agent_mode.collection
